<!DOCTYPE html>
<!-- Synthetic fixture for advert freshness. What an anonymous read gets when
     LinkedIn puts up its login wall: the request is redirected to
     /authwall?trk=... and the page asks to sign in. Nothing on it says
     anything about the advert, so the checker reads it as unknown. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Sign Up | LinkedIn</title>
</head>
<body>
  <main class="authwall">
    <h1 class="authwall-join-form__title">Join LinkedIn</h1>
    <p>Sign in to see this job and more.</p>
    <a class="authwall-join-form__form-toggle--bottom" href="/login">Sign in</a>
  </main>
</body>
</html>
