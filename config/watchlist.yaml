  # results call, Amazon's quarterly sales, a Samsung profit line and a fable
  # about research advice. The firehose the note below anticipated arrived,
  # and the category feeds it suggested were never narrow enough to be worth
  # finding. The rubric was right every time, so this is not a scoring fault,
