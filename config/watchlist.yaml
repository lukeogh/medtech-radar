  - id: new-electronics
    name: New Electronics
    tier: 2
    url: "https://www.newelectronics.co.uk/electronics-news/"
    method: diff
    check_interval_hours: 24
    status: unverified
    notes: >
      Site returns HTTP 403 to plain fetches (bot blocking), so neither the news
      page nor any feed could be confirmed. Feed directories claim an RSS feed
      exists but no working URL was verifiable. A watcher would need browser-like
      headers or JS rendering. Skipped on normal runs, spot-check with --source.

  # Parked 1 August 2026 on the same evidence, same terms. Semiconductor
  # Digest was the loudest source on the watchlist, 10 of the first 26 scored
  # signals, average relevance 3.0, best 12, none near the bar. Fab capacity,
  # sealing production lines and x86 licensing are real semiconductor news
  # and none of it is a European medtech company that might need software
  # help. Photonics coverage stays through optics.org and PIC Magazine, which
