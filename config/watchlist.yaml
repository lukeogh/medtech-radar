# MedTech Radar watchlist. Read by scripts/check_signals.py.
#
# Every entry under `sources:` was verified live on 20 July 2026 unless marked
# status: unverified. Fields per source:
#   id                    stable key, used in the source_state and signals tables
#   name                  human label
#   tier                  1 = origin sources where hours matter, checked every 6 hours
#                         2 = trade-press safety net, a day behind is fine, checked daily
#   url                   the verified listing page (the final URL after any redirects)
#   method                rss  = fetch rss_url, parse with feedparser, new entry ids are new items
#                         diff = fetch url, hash normalised text, on change diff the article links
#   rss_url               only present where a working feed was found
#   check_interval_hours  per-source floor. The script also honours the global
#                         min_check_interval_hours in config/radar.yaml, whichever is longer.
#   status                live = verified fetchable tonight. unverified = could not confirm
#                         (the script skips these unless spot-checked with --source)
#   notes                 what verification found, including fallbacks and known quirks
#
# The `email_sources:` section is tier 3, informational only. Those signals arrive
# by email into the aggregator inbox and are handled by the radar-inbox workflow,
# never fetched by check_signals.py. Listed here so the whole watchlist lives in one file.

sources:
  # ---- Tier 1. Origins. Institute press desks, accelerators and investor news pages.
  - id: imec-press
    name: imec press releases
    tier: 1
    url: "https://www.imec-int.com/en/reading-room?type=press"
    method: diff
    check_interval_hours: 6
    status: live
    notes: >
      Press releases live under /en/press/<slug>; the listing is the reading room
      filtered to type=press. Page fetches OK but the list items are populated
      client-side via JS, so a plain HTTP diff may see little or no change. No RSS
      feed found. If this source stays silent, the Tier 2 net and email alerts cover it.

  - id: imec-xpand
    name: imec.xpand
    tier: 1
    url: "https://imecxpand.com/en/news"
    method: diff
    check_interval_hours: 6
    status: live
    notes: >
      News page lists dated portfolio company news including funding and acquisitions.
      No RSS feed (/feed returns 404). Content renders in plain HTML so diffing works.

  - id: imec-istart
    name: imec.istart accelerator cohort announcements
    tier: 1
    url: "https://www.imecistart.com/en/news"
    method: diff
    check_interval_hours: 6
    status: live
    notes: >
      Working news listing with cohort announcements. No RSS feed found
      (/en/news/rss.xml 404s). Next.js site with a cookie banner but the listing
      renders in plain HTML, so diff watching works.

  - id: qbic
    name: Qbic fund news
    tier: 1
    url: "https://qbic.be/news"
    method: diff
    check_interval_hours: 6
    status: live
    notes: >
      Chronological fund and portfolio news, server-rendered, no cookie wall.
      No RSS feed (/news/rss 404s). Article URLs use a /nieuws/ path.

  - id: noshaq
    name: Noshaq news
    tier: 1
    url: "https://noshaq.be/actualites/"
    method: diff
    check_interval_hours: 6
    status: live
    notes: >
      French-language news listing for the Liege investment fund, server-rendered.
      No RSS feed (/feed/ returns HTTP 500). Story cards carry no visible dates,
      so the differ keys on titles and links. Cookie banner present but content
      is static HTML.

  - id: kurma
    name: Kurma Partners news
    tier: 1
    url: "https://www.kurmapartners.com/en/news"
    method: diff
    check_interval_hours: 6
    status: live
    notes: >
      Server-rendered chronological listing of portfolio financings and exits with
      dates. No RSS feed (/en/news/feed returned HTTP 500).

  - id: white-fund
    name: White Fund news
    tier: 1
    url: "https://whitefund.be/"
    method: rss
    rss_url: "https://whitefund.be/feed/"
    check_interval_hours: 6
    status: live
    notes: >
      Correct domain is whitefund.be (white-fund.be does not resolve). WordPress
      site with no dedicated news page. /feed/ is a valid RSS feed that currently
      holds zero items, so new posts should appear there first. If the feed stays
      empty while the fund is visibly active, switch this entry to diff on the homepage.

  - id: wallonie-entreprendre
    name: Wallonie Entreprendre press
    tier: 1
    url: "https://www.wallonie-entreprendre.be/fr/actualites/"
    method: diff
    check_interval_hours: 6
    status: live
    notes: >
      Server-rendered dated news listing with standard pagination. No RSS feed
      (/fr/actualites/feed/ 404s).

  - id: csem
    name: CSEM news and spin-offs
    tier: 1
    url: "https://www.csem.ch/en/news/"
    method: diff
    check_interval_hours: 6
    status: live
    notes: >
      Server-rendered dated news listing including spin-off announcements. No RSS
      feed (/en/news/rss 404s). JS filters on the page but the core listing is
      plain HTML.

  - id: tyndall
    name: Tyndall National Institute news
    tier: 1
    url: "https://www.tyndall.ie/news/"
    method: diff
    check_interval_hours: 6
    status: live
    notes: >
      Paginated dated news listing, plain HTTP, no cookie wall. /news/feed/ returns
      valid RSS XML but it is an empty comments feed with no items, so diffing the
      listing page is the reliable method.

  - id: cea-leti
    name: CEA-Leti press
    tier: 1
    url: "https://www.leti-cea.com/cea-tech/leti/english/Pages/What%27s-On/Press%20release/press-releases.aspx"
    method: rss
    rss_url: "https://www.leti-cea.com/cea-tech/leti/english/_layouts/15/i2i/web/ceasrchrss.ashx?pid=9&wid=g_29d89a54_1e17_43a9_b17f_30d9e1502a6f"
    check_interval_hours: 6
    status: live
    notes: >
      Working RSS 2.0 feed with recent items mixing press releases and news across
      semiconductors, quantum, photonics and biomedical. SharePoint site. The feed
      URL embeds a GUID widget id that could change if the site is rebuilt, so keep
      the press-releases listing page above as the fallback diff target.
      Since at least 1 August 2026 the watcher records this source as
      robots-blocked, so nothing is being read from it. That is the politeness
      gate working, not a fault, and it is left in place deliberately. Coverage
      dashboard names it as the one source gone dark. Revisit only if CEA-Leti
      publishes a feed its robots.txt permits.

  - id: fraunhofer-venture
    name: Fraunhofer Venture news
    tier: 1
    url: "https://www.fraunhoferventure.de/de/news.html"
    method: diff
    check_interval_hours: 6
    status: live
    notes: >
      German-language spin-off and funding news, static dated entries with
      pagination. No RSS feed found.

  - id: tno
    name: TNO press and spin-offs
    tier: 1
    url: "https://www.tno.nl/en/newsroom/news/"
    method: diff
    check_interval_hours: 6
    status: live
    notes: >
      Dated news listing in plain HTML, newest first, includes spin-off and
      joint-venture announcements. No RSS feed (/en/rss 404s).

  - id: holst
    name: Holst Centre news
    tier: 1
    url: "https://www.holstcentre.com/insights/"
    method: diff
    check_interval_hours: 6
    status: live
    notes: >
      Insights page is the news listing, dated articles under
      /insights/news/[year]/[slug]/. No RSS feed (/feed 404s).

  # ---- Tier 2. Safety net. Trade press, a day behind is acceptable.
  - id: optics-org
    name: optics.org
    tier: 2
    url: "https://optics.org/"
    method: diff
    check_interval_hours: 24
    status: live
    notes: >
      Watches the homepage, which carries the current article links, because
      every news listing path on this site started hanging on 1 August 2026.
      /news, /news/ and all four category pages time out with zero bytes,
      /news.xml 301s to /news and hangs with it, while the homepage answers in
      0.7s and individual articles in 0.8s. Not our end. A browser user agent
      hangs the same way, so does a second machine on a different route out,
      robots allows both paths and robots.txt is itself a 404 page. Index
      generation failing server-side while static pages render is their bug to
      fix. The homepage carries more churn than a clean listing, promo blocks
      and sidebars, but the link differ ignores repeats it has already seen,
      the same trade already accepted for startups-magazine. Still no RSS
      (/rss and /feed both 404). If the listing recovers, /news is the better
      target and this should go back to it.

