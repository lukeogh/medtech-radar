# MedTech Radar configuration. Luke edits this file, scripts and workflows read it.
# Secrets never live here. They live in .env, referenced by name only.
#
# Lines marked TODO were not filled in before the overnight build.
# Sensible defaults were inferred where possible. Confirm each one in the morning.

project_dir: "."                        # repo root, scripts resolve relative to this file

# Self-hosted n8n. Confirmed responding on the morning of 21 July 2026.
n8n_url: "https://n8n.keogh.cloud"

# Self-hosted ntfy, confirmed live on 29 July 2026. Proxied by NPM to the
# finance ntfy server, the one that reaches the iPhone. The server is
# deny-all, so publishing needs NTFY_TOKEN in .env with rw on this topic.
ntfy_url: "https://ntfy.keogh.cloud"
ntfy_topic_radar: "radar-signals"

aggregator_email: "medtechradar@gmail.com"
digest_to: "digest@lkeoghqa.co.uk"      # emitted by build_digest.py, used by the send node

digest_day_time: "Monday 07:30 Europe/London"

cv_file: "config/profile/cv.pdf"        # drop the CV here, gitignored
prefs_file: "config/profile/preferences.md"

# Live scoring refuses to run against the test fixture profile when no CV is
# in config/profile/. This override exists for deliberate experiments only.
# Mock mode always uses the fixture freely, the tests depend on that.
allow_fixture_profile: false

score_threshold: 70                     # combined score needed to appear in digest

# A second bar for the digest, on want_match alone. Combined averages
# capability and desire, so a role Luke could clearly do but does not want can
# still clear 70 on the strength of the CV half. Set this to require the
# desire half as well, 50 is the sensible first try. Zero means off, and off
# is the shipped default because turning it on changes what the Monday email
# contains and that is a decision rather than a tuning.
digest_min_want: 0
fast_signal_threshold: 75               # relevance needed for an immediate ntfy push

# Euro day rates convert to GBP at this rate for banding. Deliberately
# static and roughly right. Banding needs a stable yardstick, not a live FX
# feed, and a band that flickers with the market would be worse than one
# that is a few percent out.
eur_to_gbp: 0.85

# Where serve_dashboard.py binds. LAN only by design, never expose it
# beyond the LAN or the tailnet, the page carries scored opportunities,
# names and now accepts writes. Flags --host and --port override.
dashboard_host: "127.0.0.1"
dashboard_port: 8787

# Send the Monday email even when there is nothing to report. A quiet week
# then sends a short digest saying so, because silence should mean breakage
# and nothing else. Set false to hold the email on genuinely empty weeks.
digest_send_when_empty: true

claude_model_extract: "claude-haiku-4-5"
claude_model_score: "claude-sonnet-4-6"
api_key_env: "ANTHROPIC_API_KEY"        # name only, value lives in .env

# The connector circle. People who introduce, not companies who buy. LUKE
# FILLS THIS IN, by name, exactly as they appear in the touch log. Nothing
# automated ever touches them, no draft is written for them and no push
# fires about them. Home simply names the ones nobody has spoken to in sixty
# days, because a circle you do not work is a list of names.
connectors: []
connector_quiet_days: 60

# Where an insight happened, for grouping the Insights page. Ordered. The
# first group whose rule matches wins, and the last one catches everything
# left, including companies not yet enriched, because a company with no
# country must still appear somewhere rather than vanish off the page.
#
# LUKE EDITS local_places. It is the list of counties and cities that count
# as near enough to meet before lunch. It ships with a South East England
# default because that is where you are, and it is meant to be changed the
# first time it puts something in the wrong group. Matching is on the city
# or the county as the enricher recorded it, case and spacing ignored.
regions:
  - name: "Local"
    match: places
    local_places:
      - "Surrey"
      - "West Sussex"
      - "East Sussex"
      - "Hampshire"
      - "Kent"
      - "Berkshire"
      - "Greater London"
      - "London"
      - "Guildford"
      - "Woking"
      - "Reading"
      - "Brighton"
      - "Crawley"
      - "Horsham"
  - name: "UK"
    match: countries
    countries: ["United Kingdom", "UK", "England", "Scotland", "Wales",
                "Northern Ireland", "Great Britain"]
  - name: "Europe"
    match: countries
    countries: ["Belgium", "Netherlands", "Germany", "France", "Ireland",
                "Denmark", "Sweden", "Norway", "Finland", "Switzerland",
                "Austria", "Spain", "Portugal", "Italy", "Poland", "Czechia",
                "Czech Republic", "Slovakia", "Slovenia", "Hungary", "Romania",
                "Bulgaria", "Croatia", "Greece", "Estonia", "Latvia",
                "Lithuania", "Luxembourg", "Iceland", "Malta", "Cyprus"]
  - name: "Elsewhere"
    match: rest

# How many companies may be enriched in one run. Enrichment is one fast-model
# pass per company, ever, at first sight, so this is a ceiling on a cost that
# does not repeat rather than a recurring bill. Raise it to drain a backlog
# faster, lower it to keep an inbox run short.
enrich_cap_per_run: 5

# Minimum hours between checks of any single watched source. Politeness floor.
min_check_interval_hours: 6

# User agent for polite fetching. A normal browser-style string with contact hint.
fetch_user_agent: "Mozilla/5.0 (compatible; MedTechRadar/1.0; personal news watcher)"
