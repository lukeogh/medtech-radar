# MedTech Radar configuration. Luke edits this file, scripts and workflows read it.
# Secrets never live here. They live in .env, referenced by name only.
#
# Lines marked TODO were not filled in before the overnight build.
# Sensible defaults were inferred where possible. Confirm each one in the morning.

project_dir: "."                        # repo root, scripts resolve relative to this file

# Self-hosted n8n. Confirmed responding on the morning of 21 July 2026.
n8n_url: "https://n8n.keogh.cloud"

# Self-hosted ntfy. TODO this guess does not answer from this machine.
# Put the real ntfy base URL here before arming radar-signals. If the server
# is LAN-only it may still be right from the n8n host, test from there.
ntfy_url: "https://ntfy.keogh.cloud"
ntfy_topic_radar: "radar-signals"

aggregator_email: "medtechradar@gmail.com"
digest_to: "digest@lkeoghqa.co.uk"      # emitted by build_digest.py, used by the send node

digest_day_time: "Monday 07:30 Europe/London"

cv_file: "config/profile/cv.pdf"        # drop the CV here, gitignored
prefs_file: "config/profile/preferences.md"

# Live scoring refuses to run against the test fixture profile when no CV is
# in config/profile/. This override exists for deliberate experiments only.
# Mock mode always uses the fixture freely, the tests depend on that.
allow_fixture_profile: false

score_threshold: 70                     # combined score needed to appear in digest
fast_signal_threshold: 75               # relevance needed for an immediate ntfy push

# Send the Monday email even when there is nothing to report. A quiet week
# then sends a short digest saying so, because silence should mean breakage
# and nothing else. Set false to hold the email on genuinely empty weeks.
digest_send_when_empty: true

claude_model_extract: "claude-haiku-4-5"
claude_model_score: "claude-sonnet-4-6"
api_key_env: "ANTHROPIC_API_KEY"        # name only, value lives in .env

# Minimum hours between checks of any single watched source. Politeness floor.
min_check_interval_hours: 6

# User agent for polite fetching. A normal browser-style string with contact hint.
fetch_user_agent: "Mozilla/5.0 (compatible; MedTechRadar/1.0; personal news watcher)"
